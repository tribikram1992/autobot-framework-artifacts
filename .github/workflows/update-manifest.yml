# Receives repository_dispatch from framework source repos after they push
# artifacts into maven-repo/ (or python/ etc.) via the release workflow.
# Updates manifest.json latest pointer and version metadata.

name: Update manifest

on:
  repository_dispatch:
    types: [artifact-published]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest.json
        env:
          FRAMEWORK: ${{ github.event.client_payload.framework }}
          VERSION: ${{ github.event.client_payload.version }}
          METADATA: ${{ toJson(github.event.client_payload.metadata) }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime

          with open("manifest.json") as f:
              m = json.load(f)

          fw   = os.environ["FRAMEWORK"]
          ver  = os.environ["VERSION"]
          meta = json.loads(os.environ["METADATA"])

          entry = {
              "released_at": datetime.datetime.utcnow().isoformat() + "Z",
          }
          entry.update(meta)

          m["frameworks"][fw]["versions"][ver] = entry
          m["frameworks"][fw]["latest"] = ver

          with open("manifest.json", "w") as f:
              json.dump(m, f, indent=2)
          print(f"manifest.json: {fw} latest → {ver}")
          EOF

      - name: Commit manifest update
        run: |
          git config user.name  "Autobot CI"
          git config user.email "ci@autobot"
          git add manifest.json
          git diff --staged --quiet || git commit -m "release: ${{ github.event.client_payload.framework }} ${{ github.event.client_payload.version }}"
          git push
